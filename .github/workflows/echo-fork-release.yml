name: Echo Fork Build and Release

on:
  push:
    branches:
      - echo-chirp-backport
  workflow_dispatch:
    inputs:
      release_build:
        description: Build without revision suffix (stable-style)
        required: true
        default: false
        type: boolean
      publish_release:
        description: Publish a GitHub release in this fork
        required: true
        default: false
        type: boolean
      tag_name:
        description: Optional tag name for release (auto-generated if blank)
        required: false
        default: ""
        type: string
      prerelease:
        description: Mark release as prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-22.04
    outputs:
      ci_targets: ${{ steps.get-targets.outputs.ci_targets }}
      release_shard_0: ${{ steps.get-targets.outputs.release_shard_0 }}
      release_shard_1: ${{ steps.get-targets.outputs.release_shard_1 }}
      release_shard_2: ${{ steps.get-targets.outputs.release_shard_2 }}
      release_board_count: ${{ steps.get-targets.outputs.release_board_count }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache build toolchain
        uses: actions/cache@v4
        id: cache-toolchain
        with:
          path: tools
          key: ${{ runner.os }}-${{ hashFiles('mk/tools.mk') }}

      - name: Download and install toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: make arm_sdk_install

      - name: Hydrate configuration
        run: make configs

      - name: Cache hydrated board config repo
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/cache@v4
        with:
          path: src/config
          key: ${{ runner.os }}-bf-config-${{ hashFiles('mk/config.mk') }}

      - name: Get all official build targets
        id: get-targets
        run: echo "ci_targets=$(make targets-ci-print | jq -R -c 'split(" ")')" >> "$GITHUB_OUTPUT"

      - name: Get release board matrix shards
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail

          boards_json=$(make targets-ci-board-print | jq -R -c 'split(" ") | map(select(length > 0))')
          board_count=$(echo "$boards_json" | jq 'length')
          mapfile -t boards < <(echo "$boards_json" | jq -r '.[]')

          shard0=()
          shard1=()
          shard2=()

          for index in "${!boards[@]}"; do
            board="${boards[$index]}"
            case $((index % 3)) in
              0) shard0+=("$board") ;;
              1) shard1+=("$board") ;;
              2) shard2+=("$board") ;;
            esac
          done

          shard0_json=$(printf '%s\n' "${shard0[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          shard1_json=$(printf '%s\n' "${shard1[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          shard2_json=$(printf '%s\n' "${shard2[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "release_board_count=$board_count" >> "$GITHUB_OUTPUT"
          echo "Detected $board_count board configs for release build"
          echo "release_shard_0=$shard0_json" >> "$GITHUB_OUTPUT"
          echo "release_shard_1=$shard1_json" >> "$GITHUB_OUTPUT"
          echo "release_shard_2=$shard2_json" >> "$GITHUB_OUTPUT"

  build-ci:
    name: Build CI (${{ matrix.target }})
    if: ${{ github.event_name == 'push' }}
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: ${{ fromJson(needs.setup.outputs.ci_targets) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch toolchain from cache
        uses: actions/cache@v4
        id: cache-toolchain
        with:
          path: tools
          key: ${{ runner.os }}-${{ hashFiles('mk/tools.mk') }}

      - name: Hydrate configuration
        run: make configs

      - name: Build target (without revision)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_build == true }}
        run: make EXTRA_FLAGS=-Werror ${{ matrix.target }}

      - name: Build target (with revision)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_build != true) }}
        run: make EXTRA_FLAGS=-Werror ${{ matrix.target }}_rev

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Assets-CI-${{ strategy.job-index }}
          path: obj/*.hex
          retention-days: 60

  build-release-shard-0:
    name: Build Release Boards A (${{ matrix.config }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.release_shard_0) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch toolchain from cache
        uses: actions/cache@v4
        id: cache-toolchain
        with:
          path: tools
          key: ${{ runner.os }}-${{ hashFiles('mk/tools.mk') }}

      - name: Fetch hydrated board config repo cache
        uses: actions/cache@v4
        with:
          path: src/config
          key: ${{ runner.os }}-bf-config-${{ hashFiles('mk/config.mk') }}

      - name: Build board config (without revision)
        if: inputs.release_build == true
        run: make EXTRA_FLAGS=-Werror ${{ matrix.config }}

      - name: Build board config (with revision)
        if: inputs.release_build != true
        run: make EXTRA_FLAGS=-Werror ${{ matrix.config }}_rev

      - name: Publish board build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Assets-BOARD-A-${{ strategy.job-index }}
          path: |
            obj/*.hex
            obj/*_${{ matrix.config }}*
          retention-days: 60

  build-release-shard-1:
    name: Build Release Boards B (${{ matrix.config }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.release_shard_1) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch toolchain from cache
        uses: actions/cache@v4
        id: cache-toolchain
        with:
          path: tools
          key: ${{ runner.os }}-${{ hashFiles('mk/tools.mk') }}

      - name: Fetch hydrated board config repo cache
        uses: actions/cache@v4
        with:
          path: src/config
          key: ${{ runner.os }}-bf-config-${{ hashFiles('mk/config.mk') }}

      - name: Build board config (without revision)
        if: inputs.release_build == true
        run: make EXTRA_FLAGS=-Werror ${{ matrix.config }}

      - name: Build board config (with revision)
        if: inputs.release_build != true
        run: make EXTRA_FLAGS=-Werror ${{ matrix.config }}_rev

      - name: Publish board build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Assets-BOARD-B-${{ strategy.job-index }}
          path: |
            obj/*.hex
            obj/*_${{ matrix.config }}*
          retention-days: 60

  build-release-shard-2:
    name: Build Release Boards C (${{ matrix.config }})
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.release_shard_2) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch toolchain from cache
        uses: actions/cache@v4
        id: cache-toolchain
        with:
          path: tools
          key: ${{ runner.os }}-${{ hashFiles('mk/tools.mk') }}

      - name: Fetch hydrated board config repo cache
        uses: actions/cache@v4
        with:
          path: src/config
          key: ${{ runner.os }}-bf-config-${{ hashFiles('mk/config.mk') }}

      - name: Build board config (without revision)
        if: inputs.release_build == true
        run: make EXTRA_FLAGS=-Werror ${{ matrix.config }}

      - name: Build board config (with revision)
        if: inputs.release_build != true
        run: make EXTRA_FLAGS=-Werror ${{ matrix.config }}_rev

      - name: Publish board build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Assets-BOARD-C-${{ strategy.job-index }}
          path: |
            obj/*.hex
            obj/*_${{ matrix.config }}*
          retention-days: 60

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y libblocksruntime-dev clang-15

      - name: Run sanity checks
        run: make EXTRA_FLAGS=-Werror checks

      - name: Run all unit tests
        run: make EXTRA_FLAGS=-Werror test-all

  result:
    name: Complete
    needs: [build-ci, build-release-shard-0, build-release-shard-1, build-release-shard-2, test]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check build matrix result
        if: ${{ github.event_name == 'push' && needs.build-ci.result != 'success' }}
        run: exit 1

      - name: Check release matrix result shard 0
        if: ${{ github.event_name == 'workflow_dispatch' && needs.build-release-shard-0.result != 'success' }}
        run: exit 1

      - name: Check release matrix result shard 1
        if: ${{ github.event_name == 'workflow_dispatch' && needs.build-release-shard-1.result != 'success' }}
        run: exit 1

      - name: Check release matrix result shard 2
        if: ${{ github.event_name == 'workflow_dispatch' && needs.build-release-shard-2.result != 'success' }}
        run: exit 1

      - name: Check test result
        if: ${{ needs.test.result != 'success' }}
        run: exit 1

  package:
    name: Package and Optional Release
    needs: result
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download matrix artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Assets-*
          merge-multiple: true
          path: Assets

      - name: Verify assets
        run: |
          set -euo pipefail
          ls -al Assets
          count=$(find Assets -maxdepth 1 -type f -name '*.hex' | wc -l)
          echo "HEX_COUNT=$count"
          if [ "$count" -eq 0 ]; then
            echo "No HEX artifacts were downloaded."
            exit 1
          fi

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd Assets
          sha256sum *.hex > checksums.sha256
          ls -al

      - name: Upload consolidated artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-fork-assets
          path: |
            Assets/*.hex
            Assets/checksums.sha256
          retention-days: 30

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          INPUT_TAG='${{ inputs.tag_name }}'
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            DATE_UTC=$(date -u +%Y%m%d)
            TAG="echo-${DATE_UTC}.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish release (optional)
        if: ${{ inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            Assets/*.hex
            Assets/checksums.sha256
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            Echo fork automated build.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
